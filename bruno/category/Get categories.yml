info:
  name: Get categories
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/categories"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data && body.data.length > 0) {
          bru.setVar('categorySlug', body.data[0].slug || '');
          bru.setVar('categoryId', body.data[0].id || '');
        }
        bru.setNextRequest('Get highlights');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
