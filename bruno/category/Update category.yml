info:
  name: Update category
  type: http
  seq: 49

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/categories/{{categoryId}}"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Test Category (Updated)",
        "description": "Updated test category from Bruno"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setNextRequest('Update highlight');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/admin/categories/3"
      method: PUT
      body:
        type: json
        data: |-
          {
            "name": "Bruno Test Category (Updated)",
            "description": "Updated test category from Bruno"
          }
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "Category Growing-up Formula (Updated) updated successfully"
            ],
            "data": {
              "id": 3,
              "name": "Growing-up Formula (Updated)",
              "slug": "growing-up-formula-updated-v2",
              "description": "Formula untuk anak usia 1-3 tahun - Updated",
              "isActive": true,
              "sortOrder": 0,
              "createdAt": "2026-05-25T14:30:00.000Z",
              "updatedAt": "2026-05-25T14:31:00.000Z",
              "imageUrl": null,
              "publicId": null,
              "altText": null,
              "width": null,
              "height": null,
              "fileSize": null,
              "format": null
            },
            "timestamp": "2026-05-25T14:31:00.000Z"
          }
  - name: "Slug Collision (500)"
    request:
      url: "{{baseUrl}}/api/admin/categories/1"
      method: PUT
      body:
        type: json
        data: |-
          {
            "slug": "asi-booster"
          }
    response:
      status: 500
      statusText: "Internal Server Error"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 500,
            "message": [
              "Internal server error"
            ],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: "Not Found (400)"
    request:
      url: "{{baseUrl}}/api/admin/categories/999999"
      method: PUT
      body:
        type: json
        data: |-
          {
            "name": "Test"
          }
    response:
      status: 400
      statusText: "Bad Request"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "Category not found"
            ],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: "Unauthorized (401)"
    request:
      url: "{{baseUrl}}/api/admin/categories/1"
      method: PUT
      body:
        type: json
        data: |-
          {
            "name": "Test"
          }
    response:
      status: 401
      statusText: "Unauthorized"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
