info:
  name: Delete category
  type: http
  seq: 56

http:
  method: DELETE
  url: "{{baseUrl}}/api/admin/categories/{{categoryId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setNextRequest('Delete highlight');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

