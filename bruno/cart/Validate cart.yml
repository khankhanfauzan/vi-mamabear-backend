info:
  name: Validate cart
  type: http
  seq: 32

http:
  method: POST
  url: "{{baseUrl}}/api/cart/validate"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/cart/validate"
      method: POST
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": ["Cart validated successfully"],
            "data": {
              "valid": true,
              "cartId": "019e61f1-ea0e-7206-af15-9d60b78c1d0a",
              "items": [
                {
                  "id": "019e61f1-ea25-761c-91f9-02da6fc5aeb5",
                  "productId": 1,
                  "variantId": 1,
                  "quantity": 2,
                  "price": "80000"
                }
              ]
            },
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: "Cart Not Found (404)"
    request:
      url: "{{baseUrl}}/api/cart/validate"
      method: POST
    response:
      status: 404
      statusText: "Not Found"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 404,
            "message": ["Cart not found"],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
