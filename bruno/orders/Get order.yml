info:
  name: Get order
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/order/{{orderId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/order/019e61f1-ea25-761c-91f9-02da6fc5aeb5"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": ["Order found"],
            "data": {
              "id": "019e61f1-ea25-761c-91f9-02da6fc5aeb5",
              "orderNumber": "ORD-001",
              "status": "COMPLETED",
              "totalPriceIdr": "160000",
              "notes": "",
              "items": [
                {
                  "id": "item-uuid",
                  "productId": 1,
                  "variantId": 1,
                  "quantity": 2,
                  "priceIdr": "80000"
                }
              ],
              "createdAt": "2026-05-25T00:00:00.000Z",
              "updatedAt": "2026-05-25T00:00:00.000Z"
            },
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: "Not Found (404)"
    request:
      url: "{{baseUrl}}/api/order/00000000-0000-0000-0000-000000000000"
      method: GET
    response:
      status: 404
      statusText: "Not Found"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 404,
            "message": ["Order not found"],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
