info:
  name: "[ADMIN] Update Tracking Number"
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/order/{{id}}/tracking"
  body:
    type: form-urlencoded
    data:
      - name: trackingNumber
        value: JNE12345
  auth: inherit

runtime:
  variables:
    - name: id
      value: 019eb26a-12fb-734c-944d-3c0ffcdd6bf3

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
