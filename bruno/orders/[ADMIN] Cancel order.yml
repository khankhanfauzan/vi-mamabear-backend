info:
  name: "[ADMIN] Cancel order"
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/admin/order/{{orderId}}/cancel"
  body:
    type: json
    data: |-
      {
        "reason": "Out of stock"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/admin/order/019e61f1-ea25-761c-91f9-02da6fc5aeb5/cancel"
      method: POST
      body:
        type: json
        data: |-
          {
            "reason": "Out of stock"
          }
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": ["Order cancelled successfully"],
            "data": {
              "id": "019e61f1-ea25-761c-91f9-02da6fc5aeb5",
              "status": "CANCELLED"
            },
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: "Unauthorized (401)"
    request:
      url: "{{baseUrl}}/api/admin/order/019e61f1-ea25-761c-91f9-02da6fc5aeb5/cancel"
      method: POST
      body:
        type: json
        data: |-
          {
            "reason": "Out of stock"
          }
    response:
      status: 401
      statusText: "Unauthorized"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 401,
            "message": ["Unauthorized"],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
