  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/admin/order?limit=20&page=1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

