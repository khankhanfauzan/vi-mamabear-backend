info:
  name: Refresh token
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (201)"
    request:
      url: "{{baseUrl}}/api/auth/refresh"
      method: POST
    response:
      status: 201
      statusText: "Created"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
        - name: Set-Cookie
          value: "accessToken=eyJhbGci...; Path=/; HttpOnly; Secure; SameSite=Strict"
        - name: Set-Cookie
          value: "refreshToken=eyJhbGci...; Path=/; HttpOnly; Secure; SameSite=Strict"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 201,
            "message": [
              "No message specified"
            ],
            "data": null,
            "timestamp": "2026-05-16T09:43:11.888Z"
          }
  - name: "Invalid Refresh Token (500)"
    request:
      url: "{{baseUrl}}/api/auth/refresh"
      method: POST
    response:
      status: 500
      statusText: "Internal Server Error"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 500,
            "message": [
              "Internal server error"
            ],
            "data": null,
            "timestamp": "2026-05-16T09:43:12.058Z"
          }
