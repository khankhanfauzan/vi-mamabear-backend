info:
  name: Get products (Pagination)
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/products"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data && body.data.data && body.data.data.length > 0) {
          bru.setVar('productSlug', body.data.data[0].slug || '');
          bru.setVar('productId', body.data.data[0].id || '');
        }
        bru.setNextRequest('Search products');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/products?limit=10&cursor=1"
      method: GET
    response:
