info:
  name: Upvote review
  type: http
  seq: 25

http:
  method: PATCH
  url: "{{baseUrl}}/api/products/{{productSlug}}/reviews/{{reviewId}}/upvote"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setNextRequest('Delete product review (Admin)');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/products/mamabear-almonmix-isi-6-sachet/reviews/1/upvote"
      method: PATCH
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "Review 1 upvoted successfully"
            ],
            "data": {
              "id": 1,
              "title": "Sangat puas",
              "reviewerId": "53ff9709-69e4-4aba-a02b-4955381f5a1c",
              "productId": 1,
              "rating": 5,
              "numUpvotes": 1,
              "description": "ASI saya meningkat drastis setelah 1 minggu konsumsi",
              "imageUrls": [],
              "createdAt": "2026-05-25T14:23:39.391Z"
            },
            "timestamp": "2026-05-25T14:30:00.000Z"
          }
  - name: "Unauthorized (401)"
    request:
      url: "{{baseUrl}}/api/products/mamabear-almonmix-isi-6-sachet/reviews/1/upvote"
      method: PATCH
    response:
      status: 401
      statusText: "Unauthorized"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 401,
            "message": [
              "Unauthorized"
            ],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: "Not Found (500)"
    request:
      url: "{{baseUrl}}/api/products/mamabear-almonmix-isi-6-sachet/reviews/999999/upvote"
      method: PATCH
    response:
      status: 500
      statusText: "Internal Server Error"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 500,
            "message": [
              "Internal server error"
            ],
            "data": null,
            "timestamp": "2026-05-25T14:24:28.235Z"
          }
