info:
  name: Get related products
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productSlug}}/related"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setNextRequest('Get product variants');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/products/mamabear-almonmix-isi-6-sachet/related"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "Returned 0 products that are similar to mamabear-almonmix-isi-6-sachet"
            ],
            "data": [],
            "timestamp": "2026-05-25T14:24:08.588Z"
          }
  - name: "Not Found (404)"
    request:
      url: "{{baseUrl}}/api/products/nonexistent-xyz/related"
      method: GET
    response:
      status: 404
      statusText: "Not Found"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 404,
            "message": [
              "Cannot find product with slug nonexistent-xyz"
            ],
            "data": null,
            "timestamp": "2026-05-25T14:24:28.261Z"
          }
