info:
  name: Get product variants
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productSlug}}/variants"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setNextRequest('Get product reviews');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/products/mamabear-almonmix-isi-6-sachet/variants"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "Found 1 variants"
            ],
            "data": [
              {
                "id": 1,
                "productId": 1,
                "name": "INTERNAL_DEFAULT",
                "priceIdr": "80000",
                "weightG": 180,
                "sku": "ALMMBR01",
                "stock": 100,
                "sortOrder": 0,
                "createdAt": "2026-05-25T14:23:12.881Z",
                "updatedAt": "2026-05-25T14:23:12.881Z",
                "images": [],
                "discount": null
              }
            ],
            "timestamp": "2026-05-25T14:24:08.521Z"
          }
  - name: "Not Found (404)"
    request:
      url: "{{baseUrl}}/api/products/nonexistent-xyz/variants"
      method: GET
    response:
      status: 404
      statusText: "Not Found"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 404,
            "message": [
              "Cannot find product with slug nonexistent-xyz"
            ],
            "data": null,
            "timestamp": "2026-05-25T14:24:28.261Z"
          }
