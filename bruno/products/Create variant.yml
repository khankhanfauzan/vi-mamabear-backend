info:
  name: Create variant
  type: http
  seq: 43

http:
  method: POST
  url: "{{baseUrl}}/api/admin/products/{{productId}}/variants"
  body:
    type: json
    data: |-
      {
        "name": "Bruno Variant {{runId}}",
        "priceIdr": 50000,
        "weightG": 100,
        "sku": "BRUNO-VAR-{{runId}}",
        "stock": 10,
        "images" : [
          {
          "imageUrl": "https://res.cloudinary.com/dfmgt1iel/image/upload/v1781623894/products/mgemlpfyi8hljgdpamh3.jpg",
          "publicId": "products/mgemlpfyi8hljgdpamh3",
          "width": 286,
          "height": 176,
          "fileSize": 11266,
          "format": "jpg",
          "altText": "kominfo",
          "sortOrder": 0
          }
        ]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data) {
          bru.setVar('variantId', body.data.id || '');
        }
        bru.setNextRequest('Create product review');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success (201)
    request:
      url: "{{baseUrl}}/api/admin/products/1/variants"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Bruno Test Variant",
            "priceIdr": 50000,
            "weightG": 100,
            "sku": "BRUNO-VAR-001",
            "stock": 10,
            "sortOrder": 1
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 201,
            "message": [
              "Variant created successfully"
            ],
            "data": {
              "id": 2,
              "productId": 1,
              "name": "MamaBear AlmonMix - Rasa Cokelat",
              "priceIdr": "80000",
              "weightG": 180,
              "sku": "ALMMBR01-CHK",
              "stock": 50,
              "sortOrder": 0,
              "createdAt": "2026-05-25T14:30:00.000Z",
              "updatedAt": "2026-05-25T14:30:00.000Z"
            },
            "timestamp": "2026-05-25T14:30:00.000Z"
          }
  - name: Unauthorized (401)
    request:
      url: "{{baseUrl}}/api/admin/products/1/variants"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Test"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 401,
            "message": [
              "Unauthorized"
            ],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: Validation Error (400)
    request:
      url: "{{baseUrl}}/api/admin/products/1/variants"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "",
            "priceIdr": "",
            "weightG": ""
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "name should not be empty",
              "priceIdr should not be empty",
              "priceIdr must be a number conforming to the specified constraints",
              "weightG should not be empty",
              "weightG must be a number conforming to the specified constraints"
            ],
            "data": null,
            "timestamp": "2026-05-25T14:24:28.235Z"
          }
  - name: Product Not Found (400)
    request:
      url: "{{baseUrl}}/api/admin/products/999999/variants"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Test Variant",
            "priceIdr": 50000,
            "weightG": 100,
            "sku": "TEST.NOTFOUND",
            "stock": 10,
            "sortOrder": 0
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "Product not found"
            ],
            "data": null,
            "timestamp": "2026-05-25T14:24:28.235Z"
          }
