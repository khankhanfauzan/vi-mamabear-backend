info:
  name: Get one product
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productSlug}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setNextRequest('Get related products');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

