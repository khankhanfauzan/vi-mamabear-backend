info:
  name: "[ADMIN] Sales report"
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/admin/reports/sales?groupBy=day"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success - Group by Day (200)"
    request:
      url: "{{baseUrl}}/api/admin/reports/sales?groupBy=day"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "No message specified"
            ],
            "data": {
              "summary": {
                "totalOrders": 0,
                "totalRevenue": 0,
                "totalSubtotal": 0,
                "totalShippingCost": 0,
                "averageOrderValue": 0,
                "uniqueCustomers": 0
              },
              "period": "day",
              "data": []
            },
            "timestamp": "2026-06-12T07:06:51.086Z"
          }
  - name: "Success - With Date Range (200)"
    request:
      url: "{{baseUrl}}/api/admin/reports/sales?startDate=2026-06-01&endDate=2026-06-12&groupBy=week"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "No message specified"
            ],
            "data": {
              "summary": {
                "totalOrders": 0,
                "totalRevenue": 0,
                "totalSubtotal": 0,
                "totalShippingCost": 0,
                "averageOrderValue": 0,
                "uniqueCustomers": 0
              },
              "period": "week",
              "data": []
            },
            "timestamp": "2026-06-12T07:06:51.086Z"
          }
  - name: "Invalid groupBy (400)"
    request:
      url: "{{baseUrl}}/api/admin/reports/sales?groupBy=invalid"
      method: GET
    response:
      status: 400
      statusText: "Bad Request"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "groupBy must be one of the following values: day, week, month, year"
            ],
            "data": null,
            "timestamp": "2026-06-12T07:06:51.086Z"
          }
  - name: "Unauthorized (401)"
    request:
      url: "{{baseUrl}}/api/admin/reports/sales?groupBy=day"
      method: GET
    response:
      status: 401
      statusText: "Unauthorized"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 401,
            "message": [
              "Unauthorized"
            ],
            "data": null,
            "timestamp": "2026-06-12T07:06:51.086Z"
          }
