info:
  name: Get settings
  type: http
  seq: 31

http:
  method: GET
  url: "{{baseUrl}}/api/admin/settings"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data && body.data.length > 0) {
          bru.setVar('settingKey', body.data[0].key || 'site_name');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success (200)
    request:
      url: "{{baseUrl}}/api/admin/settings"
      method: GET
      headers:
        - name: Authorization
          value: Bearer {{adminToken}}
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": ["Found settings"],
            "data": [
              {
                "id": 1,
                "key": "site_name",
                "value": "Mamabear | Untuk Mama",
                "type": "string",
                "description": "Public site name",
                "createdAt": "2026-05-25T14:23:11.448Z",
                "updatedAt": "2026-05-25T14:23:11.448Z"
              }
            ],
            "timestamp": "2026-05-25T14:24:08.658Z"
          }
