info:
  name: Get admin customer detail
  type: http
  seq: 49

http:
  method: GET
  url: "{{baseUrl}}/api/admin/customers/{{customerId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data) {
          bru.setVar('customerId', body.data.id || '');
        }
        bru.setNextRequest('Get users');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
