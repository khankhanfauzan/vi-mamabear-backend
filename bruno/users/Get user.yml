info:
  name: Get user
  type: http
  seq: 34

http:
  method: GET
  url: "{{baseUrl}}/api/admin/users/{{userId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setNextRequest('Get highlight');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

