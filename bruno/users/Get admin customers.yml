info:
  name: Get admin customers
  type: http
  seq: 48

http:
  method: GET
  url: "{{baseUrl}}/api/admin/customers?0="
  params:
    - name: "0"
      value: ""
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data && body.data.items && body.data.items.length > 0) {
          bru.setVar('customerId', body.data.items[0].id || '');
        }
        bru.setNextRequest('Get admin customer detail');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success (200)
    request:
      url: "{{baseUrl}}/api/admin/customers?page=1&limit=10&sort=registered_at&order=desc"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "Found 2 customers"
            ],
            "data": {
              "items": [
                {
                  "id": "53ff9709-69e4-4aba-a02b-4955381f5a1c",
                  "name": "Siti Rahayu",
                  "email": "siti.rahayu@email.com",
                  "phone": "081234567890",
                  "total_orders": 3,
                  "total_spent": 450000,
                  "registered_at": "2026-05-25T14:13:29.168Z"
                },
                {
                  "id": "936f784c-34f0-4840-8341-4a3265882a8a",
                  "name": "Dewi Lestari",
                  "email": "dewi.lestari@email.com",
                  "phone": "081298765432",
                  "total_orders": 1,
                  "total_spent": 120000,
                  "registered_at": "2026-05-25T14:13:29.174Z"
                }
              ],
              "total": 2,
              "page": 1,
              "limit": 10
            },
            "timestamp": "2026-05-25T14:24:08.470Z"
          }
  - name: Unauthorized (401)
    request:
      url: "{{baseUrl}}/api/admin/customers?page=1&limit=10"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 401,
            "message": [
              "Unauthorized"
            ],
            "data": null,
            "timestamp": "2026-05-25T14:24:28.269Z"
          }
