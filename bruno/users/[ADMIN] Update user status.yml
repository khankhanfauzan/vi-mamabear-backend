      url: "{{baseUrl}}/api/admin/users/234657ea-5641-4824-a9f8-a933c4f18b29/status"
      method: PUT
      body:
        type: json
        data: |-
          {
            "isBlocked": true
          }
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "User deactivated successfully"
            ],
            "data": {
              "id": "234657ea-5641-4824-a9f8-a933c4f18b29",
