info:
  name: "[ADMIN] Update user status"
  type: http
  seq: 35

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/users/{{userId}}/status"
  body:
    type: json
    data: |-
      {
        "isBlocked": true
      }
  auth: inherit

runtime:
  variables:
    - name: userId
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
