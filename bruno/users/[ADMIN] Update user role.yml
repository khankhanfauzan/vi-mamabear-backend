info:
  name: "[ADMIN] Update user role"
  type: http
  seq: 34

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/users/{{userId}}/role"
  body:
    type: json
    data: |-
      {
        "role": "ADMIN"
      }
  auth: inherit

runtime:
  variables:
    - name: userId
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success - Promote to Admin (200)"
    request:
      url: "{{baseUrl}}/api/admin/users/234657ea-5641-4824-a9f8-a933c4f18b29/role"
      method: PUT
      body:
        type: json
        data: |-
          {
            "role": "ADMIN"
          }
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "User role updated to ADMIN"
            ],
            "data": {
              "id": "234657ea-5641-4824-a9f8-a933c4f18b29",
              "email": "rina.wati@email.com",
              "name": "Rina Wati",
              "phone": "082112345678",
              "role": "ADMIN",
              "isVerified": false,
              "createdAt": "2026-06-11T15:01:06.321Z",
              "updatedAt": "2026-06-12T07:10:00.000Z"
            },
            "timestamp": "2026-06-12T07:10:00.000Z"
          }
  - name: "Success - Demote to User (200)"
    request:
      url: "{{baseUrl}}/api/admin/users/234657ea-5641-4824-a9f8-a933c4f18b29/role"
      method: PUT
      body:
        type: json
        data: |-
          {
            "role": "USER"
          }
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "User role updated to USER"
            ],
            "data": {
              "id": "234657ea-5641-4824-a9f8-a933c4f18b29",
              "email": "rina.wati@email.com",
              "name": "Rina Wati",
              "phone": "082112345678",
              "role": "USER",
              "isVerified": false,
              "createdAt": "2026-06-11T15:01:06.321Z",
              "updatedAt": "2026-06-12T07:10:00.000Z"
            },
            "timestamp": "2026-06-12T07:10:00.000Z"
          }
  - name: "Cannot change own role (400)"
    request:
      url: "{{baseUrl}}/api/admin/users/{{ownAdminId}}/role"
      method: PUT
      body:
        type: json
        data: |-
          {
            "role": "USER"
          }
    response:
      status: 400
      statusText: "Bad Request"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "Cannot change your own role"
            ],
            "data": null,
            "timestamp": "2026-06-12T07:10:00.000Z"
          }
  - name: "Only SUPERADMIN can assign SUPERADMIN (400)"
    request:
