  - name: "Invalid role value (400)"
    request:
      url: "{{baseUrl}}/api/admin/users/234657ea-5641-4824-a9f8-a933c4f18b29/role"
      method: PUT
      body:
        type: json
        data: |-
          {
            "role": "INVALID_ROLE"
          }
    response:
      status: 400
      statusText: "Bad Request"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "role must be one of the following values: USER, ADMIN, SUPERADMIN"
