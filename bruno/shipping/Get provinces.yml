info:
  name: Get provinces
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/shipping/province"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data && body.data.length > 0) {
          bru.setVar('provinceId', body.data[0].id || body.data[0].provinceId || '');
        }
        bru.setNextRequest('Get cities by province');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/shipping/province"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": ["No message specified"],
            "data": [
              {
                "id": "1",
                "name": "Bali"
              },
              {
                "id": "2",
                "name": "Bangka Belitung"
              }
            ],
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: "Unauthorized (401)"
    request:
      url: "{{baseUrl}}/api/shipping/province"
      method: GET
    response:
      status: 401
      statusText: "Unauthorized"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 401,
            "message": ["Unauthorized"],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
