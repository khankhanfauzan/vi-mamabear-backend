info:
  name: "[ADMIN] Get activity logs"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/admin/activity-logs?limit=20&page=1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

