info:
  name: Export Products
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/admin/reports/products/export?startDate=2026-06-01&endDate=2026-06-29&period=daily&status=COMPLETED&categoryId=1&productId=1"
  params:
    - name: startDate
      value: 2026-06-01
      type: query
    - name: endDate
      value: 2026-06-29
      type: query
    - name: period
      value: daily
      type: query
    - name: status
      value: COMPLETED
      type: query
    - name: categoryId
      value: "1"
      type: query
    - name: productId
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success
    request:
      url: "{{baseUrl}}/api/admin/reports/products/export"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: vary
          value: Origin
        - name: access-control-allow-credentials
          value: "true"
        - name: content-type
          value: text/csv
        - name: content-disposition
          value: attachment; filename=product-report.csv
        - name: date
          value: Fri, 12 Jun 2026 08:15:42 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
        - name: transfer-encoding
          value: chunked
      body:
        type: text
        data: |-
          Product,Variant,sku,category,Sales Count,revenue,salesCount
          MamaBear AlmonMix Isi 6 Sachet - Minuman Serbuk dengan Almond - Kaya Nutrisi Untuk Ibu Menyusui BPOM HALAL,Choco Hazelnut,AL.MMBR,Maternity Supplies,0,480000,NaN
