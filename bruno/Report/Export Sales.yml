info:
  name: Export Sales
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/admin/reports/sales/export?startDate=2026-06-01&endDate=2026-06-29&categoryId=1&productId=1&status=COMPLETED&period=daily"
  params:
    - name: startDate
      value: 2026-06-01
      type: query
    - name: endDate
      value: 2026-06-29
      type: query
    - name: categoryId
      value: "1"
      type: query
    - name: productId
      value: "1"
      type: query
    - name: status
      value: COMPLETED
      type: query
    - name: period
      value: daily
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success with filter
    request:
      url: "{{baseUrl}}/api/admin/reports/sales/export?startDate=2026-06-01&endDate=2026-06-29&categoryId=1&productId=1&status=COMPLETED&period=daily"
      method: GET
      params:
        - name: startDate
          value: 2026-06-01
          type: query
        - name: endDate
          value: 2026-06-29
          type: query
        - name: categoryId
          value: "1"
          type: query
        - name: productId
          value: "1"
          type: query
        - name: status
          value: COMPLETED
          type: query
        - name: period
          value: daily
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: x-powered-by
          value: Express
        - name: vary
          value: Origin
        - name: access-control-allow-credentials
          value: "true"
        - name: content-type
          value: text/csv
        - name: content-disposition
          value: attachment; filename=sales-report.csv
        - name: date
          value: Fri, 12 Jun 2026 08:20:34 GMT
        - name: connection
          value: keep-alive
        - name: keep-alive
          value: timeout=5
        - name: transfer-encoding
          value: chunked
      body:
        type: text
        data: |-
          totalRevenue,orderCount,avgOrderValue
          160000,1,160000
