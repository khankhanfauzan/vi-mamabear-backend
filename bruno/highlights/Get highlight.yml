info:
  name: Get highlight
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/api/highlights/{{highlightId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setNextRequest('Get product variants (Admin)');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/highlights/1"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "Found highlight with id 1"
            ],
            "data": {
              "id": 1,
              "name": "New Additions",
              "slug": "new-additions",
              "description": "Produk terbaru dari MamaBear",
              "isActive": true,
              "products": [
                {
                  "id": 1,
                  "name": "MamaBear AlmonMix Isi 6 Sachet",
                  "slug": "mamabear-almonmix-isi-6-sachet",
                  "isActive": true,
                  "categoryId": 1,
                  "highlightId": 1,
                  "tags": [
                    "formula",
                    "lactation"
                  ],
                  "description": "Minuman Serbuk dengan Almond",
                  "ingredients": "Daun Katuk, Daun Kelor, Almond",
                  "usageInstructions": "Seduh 1 sachet",
                  "createdAt": "2026-05-25T14:23:11.448Z",
                  "updatedAt": "2026-05-25T14:23:11.448Z"
                }
              ]
            },
            "timestamp": "2026-05-25T14:24:08.667Z"
          }
  - name: "Not Found (400)"
    request:
      url: "{{baseUrl}}/api/highlights/999999"
      method: GET
    response:
      status: 400
      statusText: "Bad Request"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 400,
            "message": [
              "Highlight not found"
            ],
            "data": null,
            "timestamp": "2026-05-25T14:24:28.252Z"
          }
