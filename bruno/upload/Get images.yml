info:
  name: Get images
  type: http
  seq: 39

http:
  method: GET
  url: "{{baseUrl}}/api/admin/upload/images"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data && body.data.length > 0) {
          bru.setVar('imageId', body.data[0].id || '');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "Success (200)"
    request:
      url: "{{baseUrl}}/api/admin/upload/images"
      method: GET
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "No message specified"
            ],
            "data": [],
            "timestamp": "2026-05-25T14:24:08.559Z"
          }
  - name: "Unauthorized (401)"
    request:
      url: "{{baseUrl}}/api/admin/upload/images"
      method: GET
    response:
      status: 401
      statusText: "Unauthorized"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 401,
            "message": [
              "Unauthorized"
            ],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
