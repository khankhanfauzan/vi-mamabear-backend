info:
  name: Upload image
  type: http
  seq: 40

http:
  method: POST
  url: "{{baseUrl}}/api/admin/upload/image"
  body:
    type: multipart-form
    data:
      - name: image
        type: file
        value:
          - C:\Users\PF45N\OneDrive\Pictures\bg.jpg
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body && body.data) {
          bru.setVar('imageId', body.data.id || '');
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Success (201)
    request:
      url: "{{baseUrl}}/api/admin/upload/image"
      method: POST
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 201,
            "message": [
              "Image uploaded successfully"
            ],
            "data": {
              "id": 1,
              "productId": 1,
              "variantId": null,
              "imageUrl": "https://res.cloudinary.com/example/image/upload/v123/image.jpg",
              "sortOrder": 1,
              "altText": null
            },
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
  - name: Unauthorized (401)
    request:
      url: "{{baseUrl}}/api/admin/upload/image"
      method: POST
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "success": false,
            "statusCode": 401,
            "message": [
              "Unauthorized"
            ],
            "data": null,
            "timestamp": "2026-05-25T00:00:00.000Z"
          }
