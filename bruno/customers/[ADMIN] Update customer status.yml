info:
  name: "[ADMIN] Update customer status"
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/customers/{{customerId}}/status"
  body:
    type: json
    data: |-
      {
        "isVerified": true
      }
  auth: inherit

runtime:
  variables:
    - name: customerId
      value: d9492654-47c3-459f-849f-76defbd5fa72

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

