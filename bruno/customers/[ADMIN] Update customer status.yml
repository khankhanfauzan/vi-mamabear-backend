        type: json
        data: |-
          {
            "isVerified": true
          }
    response:
      status: 200
      statusText: "OK"
      headers:
        - name: Content-Type
          value: "application/json; charset=utf-8"
      body:
        type: json
        data: |-
          {
            "success": true,
            "statusCode": 200,
            "message": [
              "User verification status updated to true"
            ],
            "data": {
